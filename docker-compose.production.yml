x-service: &service
  image: ${TAXHACKER_IMAGE:?Deployment must supply the published image digest}
  env_file:
    - ${DEPLOY_ENV_FILE:?Deployment must supply a generated environment file}
  environment:
    NODE_ENV: production
    BASE_URL: https://taxhacker.app
    SELF_HOSTED_MODE: "false"
    UPLOAD_PATH: /app/data/uploads
  volumes:
    - ./data:/app/data
  networks:
    - taxhacker_network
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "100M"
      max-file: "3"

services:
  app:
    <<: *service
    container_name: taxhacker_app
    ports:
      - "127.0.0.1:7331:7331"
    healthcheck:
      test: ["CMD", "node", "-e", 'fetch("http://127.0.0.1:7331/",{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))']
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12

  cron:
    <<: *service
    container_name: taxhacker_cron
    entrypoint: ["docker-cron-entrypoint.sh"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./etc/crontab:/mnt/crontab:ro

networks:
  taxhacker_network:
    driver: bridge
